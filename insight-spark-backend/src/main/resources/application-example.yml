server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  messages:
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
  datasource:
    url: jdbc:mysql://localhost:3306/insight_spark?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: your_mysql_password
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  charset:
    console: UTF-8
    file: UTF-8

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

insight:
  ai-service-url: http://localhost:8000
  neo4j:
    enabled: true
    http-url: http://localhost:7474/db/neo4j/tx/commit
    username: neo4j
    password: your_neo4j_password
  redis:
    enabled: true
    host: localhost
    port: 6379
    database: 6
  advanced-alert:
    dingtalk-webhook: "your_dingtalk_webhook"
    dingtalk-secret: "your_dingtalk_secret"
    email-target: "receiver@example.com"
    email-from: "sender@example.com"
    smtp-host: "smtp.example.com"
    smtp-port: 587
    smtp-username: "sender@example.com"
    smtp-password: "your_email_smtp_authorization_code"
    smtp-auth: true
    smtp-starttls: true
    smtp-ssl: false